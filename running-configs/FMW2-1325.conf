#
#  NOTA IMPORTANTE:
#  Toda esta configuracion la hice de forma GRAFICA (GUI) desde el
#  navegador del webterm, salvo la IP inicial de gestion de port2.
#  Este archivo es la salida de los comandos "show ..." del CLI, que
#  muestran en texto lo que la GUI guardo.
#  FortiOS no muestra los valores por defecto: por eso no aparecen el
#  puerto de la SSL-VPN (10443), el split tunneling ni el web mode
#  desactivado. Las contrasenas aparecen cifradas (ENC ...).
# =====================================================================

FMW2-1325 # show system global
config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FMW2-1325"
    set timezone 04
end

FMW2-1325 # show system interface port1
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.42.25 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
        set snmp-index 1
        set secondary-IP enable
        config secondaryip
            edit 1
                set ip 200.25.13.25 255.255.255.224
                set allowaccess ping
            next
        end
    next
end

FMW2-1325 # show system interface port2
config system interface
    edit "port2"
        set vdom "root"
        set ip 192.168.25.1 255.255.255.0
        set allowaccess ping https http
        set type physical
        set alias "LAN-SITIO2"
        set device-identification enable
        set lldp-transmission enable
        set role lan
        set snmp-index 2
        set secondary-IP enable
        config secondaryip
            edit 1
                set ip 10.13.25.129 255.255.255.240
                set allowaccess ping
            next
        end
    next
end

FMW2-1325 # show router static
config router static
    edit 1
        set gateway 192.168.42.1
        set device "port1"
    next
end

